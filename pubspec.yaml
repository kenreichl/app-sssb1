name: app_sssb1
description: "Sunny Side Songs - Back to the Garden children's book app for mobile and tablet"
# Prevent accidental publish to pub.dev (private package).
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Playback, seek, and volume fade for page music.
  just_audio: ^0.10.4
  # Interruptions (calls, headphones) → stop audio + clear highlight.
  audio_session: ^0.2.2
  # Persist global music_on preference across relaunches.
  shared_preferences: ^2.5.3
  # Parse YAML frontmatter in spread / back-cover markdown.
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/data/

  # Nunito bundled offline (variable TTF declared for regular + bold).
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
